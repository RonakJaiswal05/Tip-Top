<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TipTop Service 24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a dark, photo-led workshop. The hero photo bleeds off the right edge and fades into the page; image rails, a brand wall, a before/after slider, a pinned workshop gallery, selling and shops follow. Booking happens in a full-screen visual repair builder. */
  --bg:#151311;        /* workbench black, sampled from the photos */
  --bg-2:#1A1715;
  --deep:#0E0D0B;
  --card:#201D1A;
  --card-2:#29251F;
  --line:#3A342D;
  --line-2:#5A5148;
  --ink:#EEE8DE;       /* warm paper white */
  --muted:#A99F92;
  --dim:#7E766C;
  --brass:#C8A268;     /* TipTop gold, tuned to the photos' rim light */
  --brass-2:#E0BF86;
  --on-brass:#16130F;
  --wa:#25D366; --wa-ink:#05371B;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --gut:clamp(18px,4vw,56px);
  --bleed:max(var(--gut),calc((100vw - 1320px) / 2 + var(--gut)));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--brass);color:var(--on-brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1em;height:1em;flex:none}
h1,h2,h3{font-family:var(--display);font-stretch:85%;text-wrap:balance;letter-spacing:-.03em}
.num{font-variant-numeric:tabular-nums}

/* ---------- image placeholders ---------- */
.ph{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 30% 15%,#2E2A25 0%,#191714 70%);isolation:isolate}
.ph.dark{background:radial-gradient(120% 90% at 30% 15%,#3A332B 0%,#1C1916 65%)}
.ph::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 16px);z-index:0}
.ph.dark::before{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 1px,transparent 1px 16px)}
.ph-tag{position:absolute;left:14px;bottom:12px;right:14px;z-index:1;display:flex;gap:8px;align-items:baseline;font:600 12px/1.3 var(--body);color:rgba(238,232,222,.45);letter-spacing:.01em}
.ph.dark .ph-tag{color:rgba(255,255,255,.5)}
.ph-tag b{font-variant-numeric:tabular-nums}
.ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ph.loaded::before,.ph.loaded .ph-tag,.notag .ph-tag,.ph.notag .ph-tag{display:none}

/* ---------- floating nav ---------- */
.nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;width:min(1260px,calc(100% - 20px));display:flex;align-items:center;gap:6px;padding:7px 7px 7px 16px;border-radius:999px;background:rgba(21,19,17,.66);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(238,232,222,.09);box-shadow:0 12px 40px -22px rgba(0,0,0,.7)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.logo svg{width:32px;height:32px}
.logo b{font-family:var(--display);font-weight:750;font-size:19px;letter-spacing:-.02em;font-stretch:90%}
.nav-links{display:flex;gap:2px;margin:0 auto}
.nav-links a{padding:9px 14px;border-radius:999px;text-decoration:none;font-weight:560;font-size:15px;color:var(--muted)}
.nav-links a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.lang{display:flex;gap:0;flex:none;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav-tel{font-weight:600;font-size:14.5px;text-decoration:none;padding:0 10px;white-space:nowrap}
.cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--brass);color:var(--on-brass);font-weight:700;font-size:15px;flex:none;transition:background .2s}
.cta:hover{background:var(--brass-2)}
.cta .dot{width:7px;height:7px;border-radius:50%;background:var(--on-brass)}
@media(max-width:1060px){.nav-tel{display:none}}
@media(max-width:900px){.nav-links{display:none}.lang{margin-left:auto}}
@media(max-width:420px){.logo b{display:none}.cta{padding:0 16px}}

/* ---------- hero ---------- */
.hero{padding:clamp(96px,11vw,128px) 0 clamp(56px,7vw,96px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,3.5vw,48px);align-items:stretch}
.hero h1{font-weight:720;font-size:clamp(40px,5.3vw,94px);line-height:.95;letter-spacing:-.045em;margin-top:8px}
.hero h1 .ln > span{white-space:nowrap}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.04em}
.hero h1 .ln > span{display:block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.hero h1 .ln:nth-child(2) > span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(105%)}}
.hero-p{max-width:44ch;margin-top:22px;font-size:clamp(17px,1.35vw,19px);color:var(--muted)}
.pick-l{margin-top:clamp(28px,3.5vw,40px);font-weight:650;font-size:15px}
.devs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.dev{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 8px 14px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .2s}
.dev .ph{border-radius:15px;aspect-ratio:1}
.dev b{display:block;margin:12px 6px 0;font-weight:680;font-size:16px;line-height:1.2}
.dev small{display:block;margin:3px 6px 0;color:var(--muted);font-size:13px;line-height:1.3}
.dev:hover{transform:translateY(-5px);box-shadow:0 26px 50px -26px rgba(0,0,0,.9);border-color:var(--brass)}
.dev:hover .ph > img{transform:scale(1.06)}
@media(max-width:700px){.devs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ask{display:flex;align-items:center;gap:6px;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;transition:border-color .2s,box-shadow .2s}
.ask:focus-within{border-color:var(--brass);box-shadow:0 0 0 4px rgba(200,162,104,.12)}
.ask input{flex:1;min-width:0;height:46px;background:none;border:0;outline:0;font-size:16px}
.ask input::placeholder{color:var(--dim)}
.mic{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink);transition:background .2s}
.mic:hover{background:rgba(255,255,255,.08)}
.mic.rec{background:#C8372D;color:#fff;animation:rec 1.1s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 0 0 8px rgba(200,55,45,.18)}}
.go{height:46px;padding:0 20px;border-radius:999px;background:var(--brass);color:var(--on-brass);font-weight:700;flex:none}
.go:hover{background:var(--brass-2)}
.ask-msg{font-size:14.5px;color:var(--muted);margin:10px 4px 0;min-height:1.4em}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:22px;font-size:14.5px;font-weight:560;color:var(--muted)}
.facts span{display:inline-flex;align-items:center;gap:8px}
.facts span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}
.hero{position:relative;overflow:clip}
.hero-grid > div:first-child{position:relative;z-index:2}
.hero-media{position:relative;min-height:620px;margin:calc(-1 * clamp(96px,11vw,128px)) calc(-1 * var(--bleed)) calc(-1 * clamp(56px,7vw,96px)) -6vw;animation:reveal 1.4s cubic-bezier(.7,0,.2,1) both;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 34%),linear-gradient(0deg,transparent 0%,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 34%),linear-gradient(0deg,transparent 0%,#000 22%);mask-composite:intersect}
.hero-media .ph{position:absolute;inset:0;background:none}
.hero-media .ph::before{display:none}
.hero-media .ph > img{object-position:60% 40%}
.hero-media .ph > img{animation:settle 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes settle{from{transform:scale(1.14)}}
.glass{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:rgba(21,19,17,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(238,232,222,.12);font-weight:620;font-size:14px;color:var(--ink);box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}
.glass.st{right:var(--bleed);bottom:calc(clamp(56px,7vw,96px) + 28px)}
.glass.wy{right:var(--bleed);top:calc(clamp(96px,11vw,128px) + 8px)}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DD68C;box-shadow:0 0 0 0 rgba(30,158,90,.5);animation:pl 2s infinite}
.pulse.off{background:var(--dim);animation:none}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(30,158,90,0)}}
@media(max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-media{min-height:0;aspect-ratio:1/1;order:-1;margin:calc(-1 * clamp(96px,11vw,128px)) calc(-1 * var(--gut)) -40px;-webkit-mask-image:linear-gradient(0deg,transparent 0%,#000 35%);mask-image:linear-gradient(0deg,transparent 0%,#000 35%)}.glass.wy{right:var(--gut);top:84px}.glass.st{right:auto;left:var(--gut);bottom:56px}.hero h1{margin-top:0;position:relative}}

/* ---------- section heads ---------- */
.sec{padding:clamp(72px,10vw,140px) 0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px}
.head h2,.big{font-weight:720;font-size:clamp(40px,5.8vw,92px);line-height:.92;letter-spacing:-.04em;max-width:14ch}
.head p{max-width:38ch;color:var(--muted);font-size:clamp(16px,1.3vw,18.5px)}
.arrows{display:flex;gap:8px}
.arrows button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;background:transparent;color:var(--ink);transition:background .2s,border-color .2s}
.arrows button:hover{border-color:var(--brass);color:var(--brass)}

/* ---------- repair rail ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(232px,23vw,318px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(var(--gut),calc((100vw - 1320px)/2 + var(--gut)));padding:6px max(var(--gut),calc((100vw - 1320px)/2 + var(--gut))) 18px;margin-top:clamp(32px,4vw,52px);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{scroll-snap-align:start;display:block;align-self:start;text-align:left;position:relative;border-radius:26px;overflow:hidden;isolation:isolate}
.rcard .ph{aspect-ratio:2/3}
.rcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;z-index:3;background:linear-gradient(180deg,rgba(14,13,11,0) 0%,rgba(14,13,11,.86) 100%);pointer-events:none}
.rc-cap{position:absolute;left:20px;right:20px;bottom:18px;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rcard b{display:block;font-family:var(--display);font-stretch:90%;font-weight:680;font-size:23px;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
.rcard small{display:block;margin-top:4px;color:var(--brass);font-size:15px;font-weight:620}
.rc-go{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(238,232,222,.12);backdrop-filter:blur(8px);color:var(--ink);font-size:18px;transition:background .25s,color .25s}
.rcard:hover .rc-go{background:var(--brass);color:var(--on-brass)}
.rcard:hover .ph > img{transform:scale(1.06)}

/* ---------- before / after ---------- */
.cmp{--x:50%;position:relative;margin-top:clamp(32px,4vw,52px);border-radius:34px;overflow:hidden;aspect-ratio:3/2;max-height:82vh;width:100%;touch-action:pan-y;user-select:none;cursor:ew-resize;background:var(--card)}
.cmp .ph{position:absolute;inset:0}
.cmp .after{clip-path:inset(0 0 0 var(--x))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:var(--brass);z-index:4;box-shadow:0 0 18px rgba(0,0,0,.25)}
.cmp .knob{position:absolute;top:50%;left:var(--x);z-index:5;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--brass);display:grid;place-items:center;font-size:26px;color:var(--on-brass);box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
.cmp .lbl{position:absolute;top:18px;z-index:4;padding:8px 14px;border-radius:999px;background:rgba(21,19,17,.6);border:1px solid rgba(238,232,222,.12);backdrop-filter:blur(10px);font-weight:650;font-size:14px}
.cmp .lbl.b{left:18px}.cmp .lbl.a{right:18px}
@media(max-width:700px){.cmp{aspect-ratio:4/5}}

/* ---------- workshop (pinned gallery) ---------- */
.lab{background:var(--deep);color:var(--ink)}
.lab .head h2{color:#fff}
.lab .head p{color:var(--muted)}
.lab-sticky{padding:clamp(72px,10vw,120px) 0}
.lab.pin .lab-sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:90px 0 32px}
.lab-track{display:flex;gap:clamp(16px,2vw,28px);margin-top:clamp(32px,4vw,52px);padding:0 max(var(--gut),calc((100vw - 1320px)/2 + var(--gut)));will-change:transform}
.lab:not(.pin) .lab-track{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lcard{flex:none;width:min(64vw,760px);scroll-snap-align:start}
.lab.pin .lcard{width:min(46vw,calc((100vh - 480px) * 1.5),680px)}
.lab .head h2{font-size:clamp(36px,4.2vw,64px);max-width:15ch}
.lab.pin .head p{max-width:34ch}
.lab.pin .lab-sticky > .wrap{width:100%}
.lcard .ph{aspect-ratio:3/2;border-radius:28px}
.lcard h3{margin-top:20px;font-weight:680;font-size:clamp(22px,2vw,28px);color:#fff}
.lcard p{color:var(--muted);margin-top:4px;max-width:44ch}
.lend{flex:none;width:min(80vw,520px);display:flex;flex-direction:column;justify-content:center;padding:0 clamp(8px,2vw,32px)}
.lend b{font-family:var(--display);font-stretch:85%;font-weight:720;font-size:clamp(40px,5vw,76px);line-height:.95;letter-spacing:-.04em;color:var(--brass)}
.lend p{margin-top:16px;color:var(--ink);font-size:18px;max-width:30ch}
@media(max-width:700px){.lcard{width:84vw}.imgbtn span{display:none}}

/* ---------- sell ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.split .ph{border-radius:34px;aspect-ratio:4/5}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,3vw,32px);margin-top:28px;display:grid;gap:18px}
.lab-l{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.inp{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);padding:0 16px;font-size:16px;outline:0;transition:border-color .2s}
.inp:focus{border-color:var(--brass)}
.inp::placeholder{color:var(--dim)}
textarea.inp{height:auto;min-height:110px;padding:14px 16px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);font-weight:600;font-size:14.5px;transition:all .2s}
.chips button:hover{border-color:var(--brass)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:999px;background:var(--wa);color:var(--wa-ink);font-weight:720;font-size:17px;text-decoration:none;transition:transform .25s}
.btn-wa:hover{transform:translateY(-2px)}
.btn-wa .ico{font-size:22px}
.ticks{list-style:none;display:grid;gap:10px;margin-top:22px}
.ticks li{display:flex;gap:12px;align-items:baseline;font-weight:540}
.ticks li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--brass);transform:translateY(-2px)}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.split .ph{aspect-ratio:4/3}}

/* ---------- shops ---------- */
.shops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);margin-top:clamp(32px,4vw,52px)}
.shop{background:var(--card);border:1px solid var(--line);border-radius:30px;overflow:hidden}
.shop .ph{aspect-ratio:3/2}
.shop-b{padding:clamp(20px,2.6vw,30px);display:grid;gap:10px}
.shop h3{font-weight:720;font-size:clamp(28px,3vw,40px);line-height:1}
.stat{display:inline-flex;align-items:center;gap:9px;font-weight:620;font-size:15px}
.shop .addr{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15.5px;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--brass-2)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--brass);background:transparent;color:var(--brass)}
.btn .ico{font-size:18px}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);margin-top:clamp(16px,2.4vw,28px)}
.way{border-top:1px solid var(--line-2);padding-top:18px}
.way b{display:block;font-family:var(--display);font-stretch:90%;font-weight:680;font-size:21px;letter-spacing:-.015em}
.way p{color:var(--muted);margin-top:4px;font-size:15.5px}
.way button,.way a{margin-top:10px;font-weight:650;font-size:15px;color:var(--brass);text-decoration:underline;text-underline-offset:4px}
@media(max-width:800px){.shops,.ways{grid-template-columns:1fr}}

/* ---------- faq ---------- */
.faq-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,72px)}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-family:var(--display);font-stretch:90%;font-weight:650;font-size:clamp(19px,1.6vw,23px);letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);position:relative}
.faq summary i::before,.faq summary i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:var(--ink);transform:translate(-50%,-50%);transition:transform .3s}
.faq summary i::after{transform:translate(-50%,-50%) rotate(90deg)}
.faq details[open] summary i::after{transform:translate(-50%,-50%) rotate(0)}
.faq details p{padding:0 0 22px;color:var(--muted);max-width:60ch}
@media(max-width:800px){.faq-grid{grid-template-columns:1fr}}

/* ---------- footer ---------- */
footer{background:var(--deep);color:var(--ink);padding:clamp(64px,8vw,110px) 0 110px}
.ftel{font-family:var(--display);font-stretch:85%;font-weight:720;font-size:clamp(44px,7vw,108px);letter-spacing:-.045em;line-height:.9;color:var(--brass);text-decoration:none}
.fmail{display:inline-block;margin-top:16px;color:var(--ink);text-decoration:none;border-bottom:1px solid #555;font-size:18px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:clamp(48px,6vw,80px);font-size:15px}

@media(max-width:800px){.fgrid{grid-template-columns:1fr 1fr}}

.fab{position:fixed;right:16px;bottom:16px;z-index:45;width:58px;height:58px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:grid;place-items:center;font-size:27px;text-decoration:none;box-shadow:0 14px 30px -12px rgba(5,55,27,.55);transition:transform .25s}

.imgbtn{position:fixed;left:16px;bottom:16px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5);z-index:45;height:44px;padding:0 16px;border-radius:999px;background:rgba(28,29,32,.9);color:#fff;font-weight:620;font-size:13.5px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px)}
.imgbtn i{font-style:normal;color:var(--brass)}
.toast{position:fixed;left:50%;bottom:90px;z-index:90;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:600;font-size:15px;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- repair builder ---------- */
.bld{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:clamp(0px,2vw,28px)}
.bld-scrim{position:absolute;inset:0;background:rgba(14,15,17,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.bld-panel{position:relative;width:min(1200px,100%);height:min(800px,100%);display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);background:var(--card);border-radius:34px;overflow:hidden;animation:pin .5s cubic-bezier(.2,.8,.2,1) both;outline:0}
@keyframes pin{from{opacity:0;transform:translateY(28px) scale(.98)}}
.bld-side{position:relative;background:var(--deep);color:var(--ink);overflow:hidden}
.bld-side .ph{position:absolute;inset:0}
.bld-side .ph > img{animation:settle 1.2s cubic-bezier(.2,.8,.2,1) both}
.side-sum{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:28px;background:linear-gradient(180deg,rgba(14,13,11,0) 0%,rgba(14,13,11,.72) 38%,rgba(14,13,11,.96) 100%)}
.side-sum small{display:block;font-size:13px;font-weight:650;color:var(--dim)}

.side-price{font-family:var(--display);font-stretch:85%;font-weight:720;font-size:clamp(40px,4vw,60px);letter-spacing:-.04em;line-height:1;color:var(--brass);margin-top:14px;font-variant-numeric:tabular-nums}
.bld-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bld-top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.icb{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;transition:border-color .2s}
.icb:hover{border-color:var(--brass);color:var(--brass)}
.icb:disabled{opacity:.3;cursor:default}
.bsteps{flex:1;display:flex;gap:6px;list-style:none;min-width:0}
.bsteps li{flex:1;min-width:0}
.bsteps button{width:100%;display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:650;color:var(--dim);text-align:left}
.bsteps i{display:block;height:3px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bsteps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.bsteps .done button,.bsteps .cur button{color:var(--ink)}
.bsteps .done i::after,.bsteps .cur i::after{transform:scaleX(1)}
.bsteps .cur i::after{background:var(--brass)}
.bsteps span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bld-body{flex:1;overflow:auto;padding:clamp(20px,2.6vw,32px);overscroll-behavior:contain}
.bv.f{animation:inR .45s cubic-bezier(.2,.8,.2,1) both}
.bv.b{animation:inL .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{opacity:0;transform:translateX(34px)}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}}
.bt{font-weight:720;font-size:clamp(30px,3vw,42px);line-height:1;letter-spacing:-.035em}
.bs{color:var(--muted);margin-top:6px}
.bld-body .devs{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:22px}
.find{display:flex;align-items:center;gap:10px;margin-top:20px;height:56px;padding:0 18px;border-radius:16px;border:1px solid var(--line);background:var(--card-2);font-size:18px;color:var(--dim)}
.find:focus-within{border-color:var(--brass)}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;color:var(--ink)}
.brands{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.brands::-webkit-scrollbar{display:none}
.brands button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:620;font-size:14px;color:var(--muted)}
.brands button:hover{border-color:var(--brass);color:var(--ink)}
.brands button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-top:16px}
.mgrid > button{padding:14px 16px;border-radius:16px;border:1px solid var(--line);font-weight:640;font-size:15.5px;line-height:1.25;transition:border-color .2s,background .2s}
.mgrid > button small{display:block;font-weight:520;font-size:12.5px;color:var(--dim);margin-bottom:3px}
.mgrid > button:hover{border-color:var(--brass);background:var(--card-2)}
.mnone{grid-column:1/-1;color:var(--muted);padding:6px 2px}
.lk{font-weight:650;color:var(--brass);text-decoration:underline;text-underline-offset:4px;font-size:15px}
.tip{font-size:13.5px;color:var(--dim);margin-top:16px}
.other{display:flex;gap:8px;margin-top:12px}
.other .inp{flex:1}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.rc{display:block;align-self:start;text-align:left;border-radius:20px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.rc .ph,.rc .icon-tile{aspect-ratio:1;border-radius:18px}
.rc .icon-tile{display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);font-size:44px;color:var(--brass)}
.rc b{display:block;margin-top:10px;font-weight:650;font-size:15.5px;line-height:1.2}
.rc small{display:block;color:var(--muted);font-size:14px;margin-top:1px}
.rc:hover{transform:translateY(-3px)}
.rc:hover .ph > img{transform:scale(1.06)}
.rlist{margin-top:18px;border-top:1px solid var(--line)}
.rlist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);font-weight:600;font-size:15.5px}
.rlist button span:last-child{color:var(--muted);font-weight:560;white-space:nowrap;font-variant-numeric:tabular-nums}
.rlist button:hover{background:var(--card-2)}
.unsure{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;padding:16px 18px;border-radius:18px;border:1px dashed var(--line-2);text-align:left}
.unsure b{display:block;font-size:16px}
.unsure small{color:var(--muted)}
.unsure:hover{border-style:solid;border-color:var(--brass)}
.morebtn{margin-top:14px}
@media(max-width:560px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lines{margin-top:20px;border-top:1px solid var(--line)}
.line{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1;min-width:0;font-weight:620}
.line .p{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.rm{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:15px}
.rm:hover{background:var(--card-2);color:var(--ink)}
.tierbox{margin-top:16px;padding:16px;border-radius:20px;background:var(--card-2)}
.tierbox p{font-size:14px;color:var(--muted);margin-top:10px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg)}
.seg button{height:38px;padding:0 18px;border-radius:999px;font-weight:650;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);box-shadow:none}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:20px}
.total b{font-family:var(--display);font-stretch:85%;font-weight:720;font-size:clamp(44px,4.5vw,64px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.vat{font-size:13.5px;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:20px;border:1px solid var(--line);text-align:left;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .25s}
.opt:hover{border-color:var(--brass)}
.opt .ico{font-size:24px}
.opt b{display:block;font-size:16.5px}
.opt small{display:block;font-size:13.5px;color:var(--muted)}
.opt.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.opt.wa small{color:var(--wa-ink);opacity:.8}
.opt.wa:hover{transform:translateY(-2px)}
.sub{padding:16px;border-radius:20px;background:var(--card-2);display:grid;gap:12px;animation:fade .3s both}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.err{color:#FF8E7C;font-size:14px;font-weight:600;min-height:1.2em}
.mshop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card)}
.mshop b{display:block}
.mshop small{color:var(--muted)}
.ok{display:grid;gap:12px;justify-items:start;padding-top:10px}
.ok .ck{width:64px;height:64px;border-radius:50%;background:#3DD68C;color:#06210F;display:grid;place-items:center;font-size:30px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.proto{font-size:13.5px;color:var(--dim)}
.mini{display:none}
@media(max-width:860px){
  .bld{padding:0}
  .bld-panel{grid-template-columns:1fr;height:100%;border-radius:0}
  .bld-side{display:none}
  .mini{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:620}
  .mini .ph{width:44px;height:44px;border-radius:12px;flex:none}
  .mini span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini b{font-variant-numeric:tabular-nums}
}

/* ---------- image prompt drawer ---------- */
.drawer{position:fixed;inset:0;z-index:80}
.drawer .bld-scrim{animation:fade .25s both}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);overflow:auto;padding:28px;animation:dr .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes dr{from{transform:translateX(40px);opacity:0}}
.dpanel h2{font-weight:720;font-size:34px}
.dpanel > p{color:var(--muted);margin-top:8px}
.ditem{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ditem header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ditem b{font-size:16px}
.ditem code{font-size:12.5px;background:var(--card-2);padding:3px 7px;border-radius:6px}
.ditem small{color:var(--muted);font-size:13.5px}
.ditem pre{white-space:pre-wrap;font:14px/1.5 var(--body);color:var(--ink);background:var(--card-2);border-radius:12px;padding:12px 14px}

.ditem .real{color:#FF8E7C}
.cp{justify-self:start;height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:620;font-size:14px}

/* ---------- request form page ---------- */
.leadv{padding:clamp(96px,11vw,128px) 0 96px}
.lead-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,56px);align-items:start}
.lead-media{position:sticky;top:96px;border-radius:34px;overflow:hidden;aspect-ratio:4/5}
.lead-media .ph{position:absolute;inset:0}
.leadv h1{font-weight:720;font-size:clamp(48px,6.4vw,104px);line-height:.92;letter-spacing:-.045em}
.hint{font-size:14.5px;font-weight:600;color:var(--brass);margin-top:8px;min-height:1.3em}
.ta{position:relative}
.ta .mic{position:absolute;right:8px;bottom:8px;background:var(--card);border:1px solid var(--line)}
@media(max-width:900px){.lead-grid{grid-template-columns:1fr}.lead-media{position:relative;top:0;aspect-ratio:16/9}}

/* ---------- admin ---------- */
.adminv{padding:110px 0 96px;min-height:100vh;background:var(--bg)}
.abar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}

.atabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--card)}

.atabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acard{border:1px solid var(--line);border-radius:24px;padding:22px;background:var(--card)}
.login{max-width:440px;margin:24px auto 0;display:grid;gap:16px}
.login h1{font-size:32px;font-weight:720}
.lab{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.lin{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);padding:0 14px;font-size:16px;outline:0}

.btn-dark{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:650;text-decoration:none}
.btn-plain{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);font-weight:620;text-decoration:none;color:var(--ink);background:transparent}
.btn-plain:hover{border-color:var(--brass)}
.small{font-size:14.5px;color:var(--muted)}
.agrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.agrid{grid-template-columns:1fr}}
.adminv .seg{display:flex;flex-wrap:wrap;gap:6px;background:none;padding:0}
.adminv .seg button{height:auto;padding:8px 14px;border:1px solid var(--line);font-size:14px;color:var(--ink)}
.adminv .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.alist{display:grid;gap:2px;max-height:540px;overflow:auto;margin-top:12px}
.alist button{text-align:left;padding:9px 12px;border-radius:10px;font-size:15px;font-weight:560}
.alist button small{color:var(--dim);font-weight:500}
.alist button:hover{background:var(--card-2)}
.alist button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.alist button[aria-pressed="true"] small{color:#5c554c}
.tablewrap{overflow-x:auto}
.ptable,.rtable{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.ptable th,.rtable th{text-align:left;font-size:12.5px;color:var(--dim);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td,.rtable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable td{vertical-align:top}
.ptable input{width:96px;height:40px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:10px;padding:0 10px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;outline:0}
.ptable input:focus{border-color:var(--brass)}
.ptable .chg{border-color:var(--brass);background:rgba(200,162,104,.16)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card-2)}
.abtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}


/* ---------- brand wall ---------- */
.brandsec{background:var(--bg-2);padding:clamp(64px,9vw,120px) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bw{margin-top:clamp(28px,4vw,48px);display:grid;gap:clamp(10px,1.4vw,18px)}
.bw-row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:20px}
.bw-row > span{font-size:13.5px;font-weight:650;color:var(--dim);padding-left:var(--bleed);white-space:nowrap}
.bw-row > span{padding-left:0}
.bw-wrap{display:grid;grid-template-columns:minmax(0,1fr);row-gap:0}
.bw-track{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.bw-run{display:inline-flex;align-items:center;white-space:nowrap;animation:bw 46s linear infinite}
.bw-row:nth-child(2) .bw-run{animation-direction:reverse;animation-duration:38s}
.bw-row:nth-child(3) .bw-run{animation-duration:30s}
.bw-track:hover .bw-run{animation-play-state:paused}
@keyframes bw{to{transform:translateX(-50%)}}
.bw-run button{font-family:var(--display);font-stretch:88%;font-weight:650;font-size:clamp(30px,4.2vw,62px);letter-spacing:-.035em;color:var(--muted);padding:0 clamp(16px,1.8vw,28px);transition:color .2s}

.bw-run i{width:9px;height:9px;flex:none;border-radius:50%;background:var(--brass);opacity:.7}
@media(max-width:700px){.bw-row{grid-template-columns:minmax(0,1fr);gap:4px}}
@media (prefers-reduced-motion:reduce){.bw-run{animation:none;flex-wrap:wrap;white-space:normal}}

@media (prefers-reduced-motion:reduce){

}

(function () {
  const cmp = $("cmp"); let drag = false;
  const set = x => { x = Math.max(0, Math.min(100, x)); cmp.style.setProperty("--x", x + "%"); const k = cmp.querySelector(".knob"); if (k) k.setAttribute("aria-valuenow", Math.round(x)); cmp.dataset.x = x; };
  const at = ev => { const r = cmp.getBoundingClientRect(); set((ev.clientX - r.left) / r.width * 100); };
  cmp.addEventListener("pointerdown", ev => { drag = true; cmp.setPointerCapture(ev.pointerId); at(ev); });
  cmp.addEventListener("pointermove", ev => { if (drag) at(ev); });
  cmp.addEventListener("pointerup", () => { drag = false; });
  cmp.addEventListener("keydown", ev => { const x = +(cmp.dataset.x || 50); if (ev.key === "ArrowLeft") { set(x - 5); ev.preventDefault(); } if (ev.key === "ArrowRight") { set(x + 5); ev.preventDefault(); } });
})();

let labDist = 0;
function setupLab() {
  const sec = $("workshop"), track = $("labTrack");
  const pin = matchMedia("(min-width:900px)").matches && !reduce;
  sec.classList.toggle("pin", pin);
  if (!pin) { sec.style.height = ""; track.style.transform = ""; return; }
  labDist = Math.max(0, track.scrollWidth - innerWidth);
  sec.style.height = (innerHeight + labDist) + "px";
  onLabScroll();
}
function onLabScroll() {
  const sec = $("workshop"); if (!sec.classList.contains("pin")) return;
  const r = sec.getBoundingClientRect(), span = sec.offsetHeight - innerHeight;
  const p = span > 0 ? Math.max(0, Math.min(1, -r.top / span)) : 0;
  $("labTrack").style.transform = `translate3d(${-p * labDist}px,0,0)`;
}
addEventListener("scroll", onLabScroll, { passive:true });

    IMGS.map(m => `<div class="ditem"><header><b>${m.n} ${esc(m.name)}</b><code>img/${m.id}.jpg</code></header><small>${esc(m.ratio)} / ${esc(m.px)} / ${esc(m.where)}</small>
      ${m.real ? `<p class="att real">${esc(t("real"))}</p>` : `${m.attach ? `<p class="att">${esc(t("attach"))} ${esc(m.attach)}</p>` : ""}<pre>${esc(m.p)}</pre><button type="button" class="cp" data-cp="${m.id}">${esc(t("copy"))}</button>`}</div>`).join("");
}
$("imgLink").addEventListener("click", () => { $("drawer").hidden = false; });
$("imgBtn").addEventListener("click", () => { $("drawer").hidden = false; $("dpanel").focus && $("dpanel").focus(); });
$("drawer").addEventListener("click", e => {
  if (e.target.closest("[data-dclose]")) { $("drawer").hidden = true; return; }
  const c = e.target.closest("[data-cp]"); if (c) copyText(IMG[c.dataset.cp].p, t("copied_p"));
});
addEventListener("keydown", e => { if (e.key === "Escape" && !$("drawer").hidden) $("drawer").hidden = true; });

/* ===== Request form page ===== */
const LEAD = { cat:"phone", where:0, via:0, done:null, n:"", p:"", m:"", pr:"" };
function renderLead() {
  $("leadMedia").innerHTML = ph("hero");
  const b = $("leadBody");
  if (LEAD.done) {
    b.innerHTML = `<div class="form-card"><div class="ok"><span class="ck">${ic("check", 2.4)}</span><h2 class="bt">${esc(t("cb_done_t", { n:LEAD.done.name }))}</h2><p class="bs">${esc(t("lf_done", { n:LEAD.done.name, v:t("vias")[LEAD.done.via] }))}</p><p class="proto">${esc(t("proto"))}</p><button type="button" class="btn" id="lfNew">${esc(t("lf_new"))}</button></div></div>`;
    $("lfNew").onclick = () => { LEAD.done = null; renderLead(); };
    hydrate(); return;
  }
  b.innerHTML = `<form class="form-card" id="leadForm" novalidate>
    <div class="two"><div><label class="lab-l" for="lfName">${esc(t("name_l"))}</label><input class="inp" id="lfName" autocomplete="name" value="${esc(LEAD.n)}"></div>
    <div><label class="lab-l" for="lfPhone">${esc(t("phone_l"))}</label><input class="inp" id="lfPhone" type="tel" autocomplete="tel" value="${esc(LEAD.p)}"></div></div>
    <div><span class="lab-l">${esc(t("f_dev"))}</span><div class="chips" id="lfCat">${CATS.map(c => `<button type="button" data-v="${c}" aria-pressed="${LEAD.cat === c}">${esc(t("cat_" + c))}</button>`).join("")}</div></div>
    <div><label class="lab-l" for="lfModel">${esc(t("f_model"))}</label><input class="inp" id="lfModel" list="lfModels" placeholder="${esc(t("lf_model_ph"))}" value="${esc(LEAD.m)}"><datalist id="lfModels">${MODELS[LEAD.cat].map(m => `<option value="${esc(fullName(m))}">`).join("")}</datalist></div>
    <div><label class="lab-l" for="lfProb">${esc(t("lf_prob"))}</label><div class="ta"><textarea class="inp" id="lfProb" placeholder="${esc(t("lf_prob_ph"))}">${esc(LEAD.pr)}</textarea><button type="button" class="mic" id="lfMic" aria-label="${esc(t("mic"))}">${ic("mic")}</button></div><p class="hint" id="lfHint" aria-live="polite"></p></div>
    <div><span class="lab-l">${esc(t("lf_where"))}</span><div class="chips" id="lfWhere">${t("wheres").map((w, i) => `<button type="button" data-v="${i}" aria-pressed="${LEAD.where === i}">${esc(w)}</button>`).join("")}</div></div>
    <div><span class="lab-l">${esc(t("lf_via"))}</span><div class="chips" id="lfVia">${t("vias").map((w, i) => `<button type="button" data-v="${i}" aria-pressed="${LEAD.via === i}">${esc(w)}</button>`).join("")}</div></div>
    <p class="err" id="lfErr"></p><button type="submit" class="btn" style="height:58px;font-size:17px">${esc(t("lf_send"))}</button></form>`;
  const keep = () => { LEAD.n = $("lfName").value; LEAD.p = $("lfPhone").value; LEAD.m = $("lfModel").value; LEAD.pr = $("lfProb").value; };
  const seg = (id, key, num) => $(id).addEventListener("click", e => { const x = e.target.closest("button"); if (!x) return; keep(); LEAD[key] = num ? +x.dataset.v : x.dataset.v; renderLead(); });
  seg("lfCat", "cat", false); seg("lfWhere", "where", true); seg("lfVia", "via", true);
  const hint = () => {
    const txt = ($("lfModel").value + " " + $("lfProb").value).trim(); if (!txt) { $("lfHint").textContent = ""; return; }
    const r = parse(txt), bits = [];
    if (r.m) bits.push(fullName(r.m)); else if (r.cat) bits.push(t("cat_" + r.cat));
    if (r.keys.length) bits.push(r.keys.map(k => svName(k, r.m ? r.m.cat : r.cat)).join(", "));
    if (r.m && r.keys.length) { const v = r.keys.filter(k => k === "diagnosis" || servicesFor(r.m).includes(k)).map(k => ({ key:k, tier:k === "display" ? "p" : undefined })); if (v.length) bits.push(totalOf(r.m, v).text); }
    $("lfHint").textContent = bits.length ? t("lf_hint", { x:bits.join(" · ") }) : "";
  };
  $("lfProb").addEventListener("input", hint); $("lfModel").addEventListener("input", hint); hint();
  $("lfMic").addEventListener("click", () => startVoice($("lfMic"), txt => { $("lfProb").value = txt; hint(); }, msg => { $("lfHint").textContent = msg; }));
  $("leadForm").addEventListener("submit", e => {
    e.preventDefault(); keep();
    const n = LEAD.n.trim(), p = LEAD.p.trim(), err = $("lfErr");
    if (!n) { err.textContent = t("err_name"); $("lfName").focus(); return; }
    if (p.replace(/\D/g, "").length < 6) { err.textContent = t("err_phone"); $("lfPhone").focus(); return; }
    addReq({ name:n, phone:p, device:LEAD.m.trim() || t("cat_" + LEAD.cat), repair:LEAD.pr.trim() || "–", total:t("wheres")[LEAD.where], via:"form", contact:t("vias")[LEAD.via] });
    LEAD.done = { name:n, via:LEAD.via }; LEAD.n = LEAD.p = LEAD.m = LEAD.pr = ""; renderLead();
  });
  hydrate();
}

/*ADMIN*/

/* ===== Language, routing, boot ===== */
function render() { if (!$("bld").hidden) renderB(); renderRail(); hydrate(); }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-tp]").forEach(el => { el.placeholder = t(el.dataset.tp); });
  document.querySelectorAll("[data-ta]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.ta)); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("fab").innerHTML = ic("wa", 1.9); $("fab").href = waLink(t("wa_general"));
  $("bldBack").innerHTML = ic("left", 2); $("bldClose").innerHTML = ic("x", 2);
  renderHero(); renderRail(); renderBrands(); renderCmp(); renderLab(); renderSell(); renderShops(); renderFaq(); renderDrawer();
  if (!$("bld").hidden) renderB();
  if (!$("v-lead").hidden) renderLead();
  if (!$("v-admin").hidden) renderAdmin();
  hydrate(); requestAnimationFrame(setupLab);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; LS.set("tt-lang", lang); applyLang(); }));
function route() {
  const h = location.hash.slice(1);
  const view = h === "anfrage" ? "lead" : h === "admin" ? "admin" : "site";
  const wasHidden = $("v-site").hidden;
  $("v-site").hidden = view !== "site"; $("v-lead").hidden = view !== "lead"; $("v-admin").hidden = view !== "admin";
  $("fab").hidden = view === "admin";
  if (view === "lead") { renderLead(); scrollTo(0, 0); }
  else if (view === "admin") { renderAdmin(); scrollTo(0, 0); }
  else if (wasHidden) { requestAnimationFrame(() => { setupLab(); const tg = h && document.getElementById(h); tg ? tg.scrollIntoView() : scrollTo(0, 0); }); }
}
addEventListener("hashchange", route);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(setupLab, 150); });
buildModels();
applyLang();
route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(setupLab);
setInterval(() => { renderShops(); hydrate($("shopList")); }, 60000);
})();
</script>
</body>
