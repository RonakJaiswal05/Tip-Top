[project]
name = "tiptop"
version = "1.0.0"
description = "Website, price calculator and admin for TipTop Service 24 (Berlin)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "django-simple-history>=3.8",
    "django-auditlog>=3.1",
    "django-otp>=1.6",
    "qrcode[pil]>=8.0",
    "django-axes>=7.0",
    "django-anymail[brevo]>=13.0",
    "gspread>=6.1",
    "google-auth>=2.36",
    "requests>=2.32",
    "pillow>=11.0",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "holidays>=0.60",
    "gunicorn>=23.0",
    "sentry-sdk>=2.19",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
