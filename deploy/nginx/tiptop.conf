# TipTop Service 24: production and staging on one server. Generated by deploy/setup.sh.

# HTTP -> HTTPS (keeps the ACME challenge reachable for renewals)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @DOMAIN@ www.@DOMAIN@ @STAGING_DOMAIN@;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.@DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    include snippets/tiptop-ssl.inc;
    return 301 https://@DOMAIN@$request_uri;
}

# production
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    include snippets/tiptop-ssl.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include snippets/tiptop-production.inc;
}

# staging: password protected and never indexed
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @STAGING_DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@STAGING_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@STAGING_DOMAIN@/privkey.pem;
    include snippets/tiptop-ssl.inc;
    auth_basic "TipTop staging";
    auth_basic_user_file /etc/tiptop/staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include snippets/tiptop-staging.inc;
}

# anything else (bare IP, unknown host names)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    return 444;
}
