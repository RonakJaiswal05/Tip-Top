# /etc/nginx/conf.d/tiptop-common.conf (http context)

# Rate limits per IP: public forms and consent (the app adds its own limits on top), staff sign-in.
limit_req_zone $binary_remote_addr zone=tt_forms:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=tt_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=tt_general:20m rate=20r/s;
limit_req_status 429;

server_tokens off;
client_max_body_size 10m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;

# Shorter access logs: no query strings (they can carry a withdrawal receipt token). Kept 14 days by logrotate.
log_format tiptop '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';
