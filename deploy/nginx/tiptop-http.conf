# Before certificates exist: HTTP only, so Let's Encrypt can verify the domains. setup.sh replaces this with
# tiptop.conf as soon as both certificates are there.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@ www.@DOMAIN@;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include snippets/tiptop-production.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name @STAGING_DOMAIN@;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    auth_basic "TipTop staging";
    auth_basic_user_file /etc/tiptop/staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include snippets/tiptop-staging.inc;
}
